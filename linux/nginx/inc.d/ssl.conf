ssl_session_cache   shared:SSL:20m;
ssl_session_timeout 2d;
ssl_stapling on;
#ssl_stapling_verify      on;

#resolver                 223.5.5.5 223.6.6.6 valid=600s;
#resolver_timeout         10s;

#ssl_prefer_server_ciphers on;
#ssl_ciphers ECDHE-RSA-AES256-SHA384:AES256-SHA256:RC4:HIGH:!MD5:!aNULL:!eNULL:!NULL:!DH:!EDH:!AESGCM;

ssl_certificate           /js/my/_.pooul.com.chain.crt;
ssl_trusted_certificate   /js/my/_.pooul.com.chain+root.crt;
ssl_certificate_key       /js/my/_.pooul.com.key;